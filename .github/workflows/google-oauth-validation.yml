name: Google OAuth - validation
on:
  push:
    branches:
      - feature/google-oauth-trial-onboarding
  pull_request:
    paths:
      - 'src/lib/auth.ts'
      - 'src/app/auth/**'
      - 'src/app/api/auth/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/google-oauth-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/mds_crm_ci
      NEXTAUTH_SECRET: ci-only-not-a-production-secret-1234567890
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Check Prisma schema formatting
        run: npx prisma format --check
      - name: Build
        run: npm run build
