name: Block 2 Authorization Regression

on:
  pull_request:
    branches:
      - feature/modular-plans-entitlements
      - review/block2-sanitized-base
  push:
    branches:
      - feature/modular-plans-entitlements
      - audit/block2-sanitized
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/block2-*.mjs'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    name: Authorization, entitlements and tenant isolation (fixtures only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://mds_ci:mds_ci@127.0.0.1:5432/mds_ci
      NEXTAUTH_SECRET: ci-only-not-a-production-secret-0123456789
      ADMIN_JWT_SECRET: ci-only-admin-jwt-secret-01234567890123456789
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-tags: false
          # Positive depth fetches only this candidate, unlike depth 0 (all refs).
          # The history guard fails closed if required roots/baselines are missing.
          fetch-depth: 1000000
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Generate Prisma client locally
        run: npx prisma generate
      - name: Validate read-only route inventory
        run: node scripts/block2-route-inventory.mjs > /tmp/block2-route-inventory.json && node -e "const a=require('/tmp/block2-route-inventory.json'); if(a.summary.routeFiles<100 || a.summary.methodRows<a.summary.routeFiles) process.exit(1); console.log(JSON.stringify(a.summary))"
      - name: Verify sanitized candidate history and portable baselines
        run: node scripts/block2-c6-ci.mjs history
      - name: Lint every C0-C6 changed source and test file
        run: node scripts/block2-c6-ci.mjs lint
      - name: Run all TypeScript regressions including C0-C5
        run: npx tsx --test tests/*.test.ts

      - name: Verify legacy Instagram exchange tenant guards
        run: node --test tests/authorization-instagram-exchange-tenant.test.mjs
      - name: Verify Instagram sync tenant guards
        run: node --test tests/authorization-instagram-sync-tenant.test.mjs
